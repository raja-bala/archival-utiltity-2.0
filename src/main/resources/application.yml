spring:
  application:
    name: archival-utility

  datasource:
    url: ${DB_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:archival}}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:localdbpassword}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: archival-hikari

  batch:
    job:
      # We launch the job ourselves (with a runtime-computed window) from
      # ArchivalApplicationRunner, instead of letting Boot auto-run every
      # Job bean it finds on startup.
      enabled: false
    jdbc:
      # 'always' = auto-create Spring Batch's own BATCH_* tables on every
      # startup, against MariaDB/MySQL, H2, Postgres, etc. - not just for an
      # embedded DB. This is safe to leave on permanently: Spring Boot's
      # batch schema initializer runs with continue-on-error semantics, so
      # once the tables already exist, the CREATE TABLE statements simply
      # fail silently (logged at debug level) instead of failing startup.
      # Set this to 'never' instead if you'd rather manage the BATCH_*
      # schema yourself (e.g. via a DBA-controlled migration process).
      initialize-schema: always

  sql:
    init:
      # Our own archival_job_audit table uses idempotent CREATE TABLE IF NOT
      # EXISTS DDL, so it is always safe to (re-)apply on every startup,
      # against MariaDB or H2 alike.
      mode: never
      schema-locations: classpath:db/schema-audit.sql
      continue-on-error: false

logging:
  level:
    root: INFO
    com.archival: INFO
    org.springframework.batch: INFO

# ---------------------------------------------------------------------
# Framework-wide defaults. There is no per-table config file - every table
# is described entirely by command-line arguments plus JDBC schema
# introspection at runtime (see com.archival.introspection.SchemaIntrospector).
# ---------------------------------------------------------------------
archival:
  retention-years: 5
  window-months: 4
  output-base-dir: ${ARCHIVAL_OUTPUT_DIR:/Users/bharathirajabalasubramanian/Desktop/claude/archival utiltity/}
  default-primary-key-column: id
  default-partition-granularity: MONTH
  default-fetch-size: 1000
  default-chunk-size: 500
  default-delete-batch-size: 500
  default-max-rows-per-file: 0
  audit-table: archival_job_audit
  delete-enabled: ${ARCHIVAL_DELETE_ENABLED:true}
  dry-run-default: ${ARCHIVAL_DRY_RUN:false}
