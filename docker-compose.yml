services:
  mariadb:
    image: mariadb:11.4
    container_name: archival-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: archival_demo
      MARIADB_USER: archival
      MARIADB_PASSWORD: archival
    ports:
      - "3306:3306"
    volumes:
      - archival_mariadb_data:/var/lib/mysql
      - ./docker/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  archival_mariadb_data:
